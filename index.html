        if(sld<0){
          const av=document.createElement('div'); av.className='est-alerta bad';
          av.innerHTML=`✕ <b>Saldo negativo:</b> você entregou mais do que registrou de compra. Registre a compra na aba <b>Preços</b>.`;
          b.appendChild(av);
        } else if(st==='novo'){
          const av=document.createElement('div');
          av.style.cssText='font-size:.62rem;color:var(--txt3);text-align:center;margin-bottom:10px;line-height:1.4';
          av.innerHTML='Registre uma compra na aba <b style="color:var(--txt2)">Preços</b> para o app controlar o estoque deste item.';
          b.appendChild(av);
        }
        const ch=document.createElement('div'); ch.className='cs-hdr';
        ch.innerHTML='<span>Setor</span><span>Qtde</span><span>Custo</span>';
        b.appendChild(ch);
        FAM.forEach(f=>{
          const row=document.createElement('div'); row.className='cs-row';
          const n=document.createElement('span'); n.className='cs-n'; n.textContent=f;
          const q=getCons(epiMes,e.id,f);
          const i=document.createElement('input'); i.className='cs-in'+(q?'':' zero');
          i.type='number'; i.min=0; i.placeholder='0'; i.value=q||'';
          const v=document.createElement('span'); v.className='cs-v'; v.textContent=q?'R$ '+fmt(q*p):'—';
          i.oninput=()=>{
            const nq=parseFloat(i.value)||0;
            setCons(epiMes,e.id,f,nq);
            i.classList.toggle('zero',!nq);
            v.textContent=nq?'R$ '+fmt(nq*p):'—';
            const ti=FAM.reduce((s,x)=>s+getCons(epiMes,e.id,x),0)*p;
            const el=div.querySelector('.ci-t');
            el.textContent=ti?'R$ '+fmt0(ti):'—'; el.classList.toggle('zero',!ti);
            // atualiza badge de estoque
            const nsld=saldoEstoque(e), nst=statusEstoque(e);
            const bg=div.querySelector('.est-badge');
            bg.className='est-badge '+nst;
            bg.textContent= nst==='novo' ? 'sem estoque registrado'
              : ({ok:'',baixo:'⚠ ',zero:'✕ ',neg:'✕ '}[nst])+fmt0(nsld)+' '+e.un;
            recalcLeve(); renderEpiResumo(); renderEpiMes();
          };
          row.appendChild(n); row.appendChild(i); row.appendChild(v);
          b.appendChild(row);
        });
        div.appendChild(b);
        box.appendChild(div);
      });
    });
  } else if(epiAba==='est'){
    // ===== ESTOQUE =====
    const alertas=itensAlerta();
    if(alertas.length){
      const av=document.createElement('div');
      const temZero=alertas.some(e=>saldoEstoque(e)<=0);
      av.className='est-alerta'+(temZero?' bad':'');
      const nomes=alertas.slice(0,4).map(e=>e.nome).join(', ');
      av.innerHTML=`${temZero?'✕':'⚠'} <b>${alertas.length} ${alertas.length>1?'itens precisam':'item precisa'} de reposição:</b> ${nomes}${alertas.length>4?` e mais ${alertas.length-4}`:''}`;
      box.appendChild(av);
    } else {
      const av=document.createElement('div');
      av.style.cssText='background:rgba(63,184,115,.08);border:1px solid var(--good);border-radius:7px;padding:10px 12px;font-size:.68rem;color:var(--good);margin-bottom:10px';
      const comEstoque=Dmo.epis.filter(e=>statusEstoque(e)!=='novo').length;
      av.innerHTML= comEstoque>0
        ? `✓ Estoque em dia — ${comEstoque} ${comEstoque>1?'itens controlados':'item controlado'}, nenhum crítico.`
        : '📋 Registre as compras na aba <b>Preços</b> para o app controlar o estoque.';
      box.appendChild(av);
    }
    const cats=[...new Set(Dmo.epis.map(e=>e.cat))];
    cats.forEach(cat=>{
      const itens=Dmo.epis.filter(e=>e.cat===cat);
      const lista=document.createElement('div'); lista.className='est-lista';
      lista.innerHTML=`<div class="el-t">${cat}</div>`;
      const hdr=document.createElement('div');
      hdr.style.cssText='display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.5rem;color:var(--txt3);text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:3px';
      hdr.innerHTML='<span>Item</span><span style="text-align:right">Saldo</span><span style="text-align:center">Mín.</span>';
      lista.appendChild(hdr);
      itens.forEach(e=>{
        const sld=saldoEstoque(e), st=statusEstoque(e);
        const cob=mesesCobertura(e);
        const cor={ok:'var(--good)',baixo:'var(--warn)',zero:'var(--bad)',neg:'var(--bad)',novo:'var(--txt3)'}[st];
        const row=document.createElement('div'); row.className='el-r';
        const n=document.createElement('span'); n.className='el-n';
        n.innerHTML=`${e.nome}${cob!==null&&sld>=0?` <span style="font-size:.53rem;color:var(--txt3)">${cob.toFixed(1)} mês${cob>=2?'es':''}</span>`:''}`;
        const s=document.createElement('span'); s.className='el-s'; s.style.color=cor;
        s.textContent= st==='novo' ? '—' : fmt0(sld);
        if(st==='novo') s.style.fontWeight='400';
        const mi=document.createElement('input'); mi.className='el-min'; mi.type='number'; mi.min=0;
        mi.placeholder='—'; mi.value=e.minimo||'';
        mi.oninput=()=>{e.minimo=parseFloat(mi.value)||0;renderEpi();};
        row.appendChild(n); row.appendChild(s); row.appendChild(mi);
        lista.appendChild(row);
      });
      box.appendChild(lista);
    });
    const nota=document.createElement('div');
    nota.style.cssText='font-size:.62rem;color:var(--txt3);line-height:1.5;margin-top:6px';
    nota.innerHTML='<b style="color:var(--txt2)">Saldo</b> = total comprado − total entregue. Defina o <b style="color:var(--txt2)">mínimo</b> de cada item para receber alerta. O app também avisa quando o estoque durar menos de 1,5 mês no ritmo atual.';
    box.appendChild(nota);
  } else {
    // PREÇOS + histórico
    Dmo.epis.forEach(e=>{
      const compras=[...(e.compras||[])].sort((a,b)=>b.data.localeCompare(a.data));
      const p=precoEpi(e);
      const div=document.createElement('div'); div.className='pr-box'+(precOpen[e.id]?' open':'');
      const h=document.createElement('div'); h.className='pr-h';
      h.innerHTML=`<span class="ci-exp" style="transform:${precOpen[e.id]?'rotate(90deg)':'none'}">▶</span>
        <span class="pr-n">${e.nome}</span><span class="pr-v mono">R$ ${fmt(p)}</span>`;
      h.onclick=()=>{precOpen[e.id]=!precOpen[e.id];renderEpi();};
      div.appendChild(h);
      const b=document.createElement('div'); b.className='pr-b';
      compras.forEach((c,i)=>{
        const ant=compras[i+1];
        const vp= ant&&ant.preco>0 ? (c.preco-ant.preco)/ant.preco : null;
        const l=document.createElement('div'); l.className='compra-l'+(i===0?' cl-atual':'');
        const _dt=(c.data||'').split('-'); const y=_dt[0]||'----', mo=_dt[1]||'--', dd=_dt[2]||'--';
        let vt='';
        if(vp!==null){
          const cl=Math.abs(vp)<0.005?'var(--txt3)':(vp>0?'var(--bad)':'var(--good)');
          const st=Math.abs(vp)<0.005?'≈':(vp>0?'▲':'▼');
          vt=`<span class="cl-var" style="color:${cl}">${st} ${vp>0?'+':''}${(vp*100).toFixed(0)}%</span>`;
        } else vt='<span class="cl-var" style="color:var(--txt3);font-size:.56rem">1ª</span>';
        l.innerHTML=`<span class="cl-d">${dd}/${mo}/${y.slice(2)}</span>
          <span class="cl-p mono">R$ ${fmt(c.preco)}${i===0?' <span style="font-size:.5rem;background:var(--rebar);color:#fff;padding:1px 4px;border-radius:3px">VIGENTE</span>':''}</span>
          ${vt}
          ${compras.length>1?'<button class="m-del" style="font-size:.8rem">×</button>':'<span></span>'}`;
        const del=l.querySelector('.m-del');
        if(del) del.onclick=()=>{
          const idx=e.compras.findIndex(x=>x.data===c.data&&x.preco===c.preco);
          if(idx>=0){e.compras.splice(idx,1);renderEpi();recalc();renderEpiResumo();}
        };
        b.appendChild(l);
      });
      const btn=document.createElement('button'); btn.className='btn-add2'; btn.style.marginTop='9px';
      btn.textContent='+ Nova compra';
      const form=document.createElement('div'); form.className='nc-form'+(ncOpen[e.id]?' on':'');
      form.innerHTML=`<div class="nc-g">
        <div class="nc-f"><label>Data</label><input type="date" class="nc-d" value="${Dmo.hoje}"></div>
        <div class="nc-f"><label>Preço (R$/${e.un})</label><input type="number" step="0.01" class="nc-p" placeholder="0,00"></div>
        <div class="nc-f"><label>Quantidade *</label><input type="number" class="nc-q" placeholder="0"></div>
        <div class="nc-f"><label>Fornecedor</label><input type="text" class="nc-f2" placeholder="opcional"></div>
      </div>
      <div class="nc-btns"><button class="btn-cx">Cancelar</button><button class="btn-ok">Salvar</button></div>`;
      btn.onclick=()=>{ncOpen[e.id]=true;form.classList.add('on');};
      form.querySelector('.btn-cx').onclick=()=>{ncOpen[e.id]=false;form.classList.remove('on');};
      form.querySelector('.btn-ok').onclick=()=>{
        const data=form.querySelector('.nc-d').value;
        const preco=parseFloat(form.querySelector('.nc-p').value)||0;
        const qtde=parseFloat(form.querySelector('.nc-q').value)||0;
        const forn=form.querySelector('.nc-f2').value||'';
        if(!data||preco<=0){alert('Informe data e preço.');return;}
        if(qtde<=0){alert('Informe a quantidade comprada — é ela que alimenta o controle de estoque.');return;}
        if(!e.compras)e.compras=[];
        e.compras.push({data,preco,qtde,forn});
        ncOpen[e.id]=false;
        renderEpi(); recalc(); renderEpiResumo();
      };
      b.appendChild(btn); b.appendChild(form);
      div.appendChild(b);
      box.appendChild(div);
    });
  }
  renderEpiResumo();
}
function renderEpiResumo(){ if(moReady) salvarMO();
  const box=document.getElementById('epi-resumo');
  const tot=totalIndP(epiMes);
  if(tot<=0){box.innerHTML='';return;}
  let rows='';
  FAM.forEach(f=>{
    const v=indiretoSetor(f,epiMes);
    if(v<=0) return;
    rows+=`<div class="rs-r"><span>${f}</span><span class="v mono">R$ ${fmt0(v)}</span></div>`;
  });
  box.innerHTML=`<div class="resumo-setor">
    <div class="rs-t">Consumo de ${mesLabel(epiMes)} por setor</div>
    ${rows}
    <div class="rs-r" style="border-top:1px dashed var(--line);margin-top:5px;padding-top:7px">
      <span style="font-weight:700">Total</span><span class="v mono" style="color:var(--rebar2)">R$ ${fmt0(tot)}</span></div>
  </div>`;
}
document.querySelectorAll('.epi-sub button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.epi-sub button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); epiAba=b.dataset.e; renderEpi();
});
function recalc(){ salvarMO(); renderSetores(); }


// recálculo leve: atualiza os números SEM redesenhar os inputs (preserva o foco ao digitar)
function recalcLeve(){ salvarMO();
  const res=calcSetores();
  FAM.forEach(f=>{
    const r=res[f];
    // atualiza cabeçalho do setor (custo/hora e métricas)
    const setorEl=document.querySelector(`.setor[data-fam="${CSS.escape(f)}"]`);
    if(setorEl){
      const chEl=setorEl.querySelector('.setor-ch .v');
      if(chEl) chEl.textContent='R$ '+fmt(r.custoHora);
      const cells=setorEl.querySelectorAll('.sm-cell .v');
      if(cells.length>=3){
        cells[0].textContent='R$ '+fmt0(r.custoTotal);
        cells[1].textContent=r.pessoas.toFixed(r.pessoas%1?1:0);
        cells[2].textContent=fmt0(r.horas);
      }
    }
    // atualiza cada produto
    r.produtos.forEach(np=>{
      const item=document.querySelector(`.prod-edit[data-fam="${CSS.escape(f)}"][data-prod="${CSS.escape(np.nome)}"]`);
      if(item && item._refresh) item._refresh(np);
    });
  });
}

// parâmetros gerais
document.getElementById('g-jornada').oninput=e=>{jornada=parseFloat(e.target.value)||8.8;recalc();};
document.getElementById('g-dias').oninput=e=>{diasIdeal=parseFloat(e.target.value)||22;recalc();};

renderPessoas(); renderEpiMes(); renderEpi(); renderSetores();

}


// ===================================================================
// SISTEMA DE AJUDA GLOBAL (tooltips "?") — compartilhado entre módulos
// ===================================================================
window.AJUDAS_ALL = {};   // cada módulo registra suas ajudas aqui
window.abrirAjuda = function(key){
  const a = window.AJUDAS_ALL[key];
  if(!a){ console.warn('ajuda não encontrada:', key); return; }
  let pop = document.getElementById('help-pop-global');
  let bd = document.getElementById('help-backdrop-global');
  if(!pop){
    bd = document.createElement('div'); bd.id='help-backdrop-global'; bd.className='help-backdrop';
    pop = document.createElement('div'); pop.id='help-pop-global'; pop.className='help-pop';
    pop.innerHTML = '<h4><span id="help-title-global"></span><button class="x" id="help-x-global">×</button></h4><div id="help-content-global"></div>';
    document.body.appendChild(bd); document.body.appendChild(pop);
    bd.addEventListener('click', window.fecharAjuda);
    document.getElementById('help-x-global').addEventListener('click', window.fecharAjuda);
  }
  document.getElementById('help-title-global').textContent = a.t;
  document.getElementById('help-content-global').innerHTML = a.c;
  pop.classList.add('on'); bd.classList.add('on');
};
window.fecharAjuda = function(){
  const pop = document.getElementById('help-pop-global');
  const bd = document.getElementById('help-backdrop-global');
  if(pop) pop.classList.remove('on');
  if(bd) bd.classList.remove('on');
};


// Função GLOBAL para abrir o formulário de nova compra (máxima robustez)
window.abrirFormCompra = function(){
  const f = document.getElementById('form-nc');
  if(!f){ alert('Formulário não encontrado na tela.'); return; }
  f.classList.add('on');
  // fundo escuro
  let bd = document.getElementById('form-nc-bd');
  if(!bd){
    bd = document.createElement('div'); bd.id='form-nc-bd'; bd.className='form-nc-backdrop';
    document.body.appendChild(bd);
    bd.onclick = ()=>{ f.classList.remove('on'); bd.classList.remove('on'); };
  }
  bd.classList.add('on');
  const d = document.getElementById('nc-data'); if(d) setTimeout(()=>d.focus(), 50);
};


// === Sincronização manual (resolver conflito entre aparelhos) ===
window.forcarEnvioMP = async function(){
  if(!window.__mpD) return;
  const D = window.__mpD;
  const listaParaMapa = (lista, chaveId='id') => { const m={}; lista.forEach((it,idx)=>{ const k=(it[chaveId]!==undefined?it[chaveId]:idx); m[k]=it; }); return m; };
  // sobrescreve TODAS as coleções na nuvem com os dados deste aparelho
  await Sync.saveAll('agregados', D.agregados);
  await Sync.saveAll('aco', listaParaMapa(D.aco));
  await Sync.saveAll('embalagem', listaParaMapa(D.embalagem));
  await Sync.saveAll('tracos', listaParaMapa(D.tracos));
  await Sync.saveAll('produtos', listaParaMapa(D.produtos, 'id'));
  await Sync.saveAll('precosAco', D.precosAco);
  await Sync.saveAll('precosEmb', D.precosEmb);
  await Sync.saveAll('compras', D.compras);
  await Sync.saveAll('meta', {versaoDados: D_DEFAULT.versaoDados});
};
window.forcarBaixarMP = async function(){
  const mapaParaLista = (mapa) => mapa ? Object.keys(mapa).sort((a,b)=>(+a)-(+b)).map(k=>mapa[k]) : null;
  const [agg, aco, emb, tr, pr, pAco, pEmb, comp] = await Promise.all([
    Sync.loadAll('agregados'), Sync.loadAll('aco'), Sync.loadAll('embalagem'),
    Sync.loadAll('tracos'), Sync.loadAll('produtos'),
    Sync.loadAll('precosAco'), Sync.loadAll('precosEmb'), Sync.loadAll('compras')
  ]);
  if(!window.__mpD) return;
  const D = window.__mpD;
  if(agg) D.agregados = agg;
  if(aco) D.aco = mapaParaLista(aco);
  if(emb) D.embalagem = mapaParaLista(emb);
  if(tr) D.tracos = mapaParaLista(tr);
  if(pr) D.produtos = Object.keys(pr).sort((a,b)=>(+a)-(+b)).map(k=>pr[k]);
  if(pAco) D.precosAco = pAco;
  if(pEmb) D.precosEmb = pEmb;
  if(comp) D.compras = comp;
  if(typeof renderAll === "function") renderAll();
};
