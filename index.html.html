<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Motor de Custos · Pedroni</title>
<style>
:root{
  --bg:#12141a;--surf:#1a1d24;--surf2:#22262f;--surf3:#2a2f39;--line:#2e333d;
  --txt:#eceef1;--txt2:#9aa0aa;--txt3:#666d78;
  --rebar:#d97642;--rebar2:#e8915f;--rebar-dim:rgba(217,118,66,.12);
  --steel:#5b9bd5;--good:#3fb873;--warn:#e0a52e;--bad:#d9534f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.mono{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ===== LOGIN ===== */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;background:linear-gradient(165deg,var(--surf) 0%,var(--bg) 60%);position:relative;overflow:hidden}
#login-screen::before{content:"";position:absolute;top:-15%;right:-20%;width:340px;height:340px;
  background:radial-gradient(circle,var(--rebar-dim) 0%,transparent 65%);pointer-events:none}
.login-box{width:100%;max-width:360px;position:relative;z-index:2}
.brand{text-align:center;margin-bottom:32px}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;
  background:var(--rebar);border-radius:16px;font-size:1.9rem;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(217,118,66,.3)}
.brand h1{font-size:1.4rem;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:.76rem;color:var(--txt3);margin-top:4px;letter-spacing:.02em}
.login-card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px}
.login-card h2{font-size:.95rem;font-weight:700;margin-bottom:4px}
.login-card .hint{font-size:.72rem;color:var(--txt3);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.68rem;color:var(--txt2);margin-bottom:6px;font-weight:600}
.field input{width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:12px 13px;font-size:.9rem;transition:border-color .15s}
.field input:focus{border-color:var(--rebar);outline:none}
.btn-primary{width:100%;background:var(--rebar);color:#fff;border:none;border-radius:9px;
  padding:13px;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .15s;margin-top:4px}
.btn-primary:active{background:var(--rebar2)}
.btn-primary:disabled{opacity:.6;cursor:default}
.login-msg{font-size:.74rem;text-align:center;margin-top:14px;min-height:18px;line-height:1.4}
.login-msg.err{color:var(--bad)}
.login-msg.ok{color:var(--good)}
.login-foot{text-align:center;font-size:.68rem;color:var(--txt3);margin-top:22px;line-height:1.5}
.login-foot a{color:var(--rebar2);cursor:pointer;text-decoration:none}

/* ===== APP SHELL ===== */
#app-screen{min-height:100vh;display:flex;flex-direction:column}
.app-header{position:sticky;top:0;z-index:40;background:rgba(18,20,26,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.ah-mark{width:32px;height:32px;background:var(--rebar);border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ah-title{flex:1;min-width:0}
.ah-title .t{font-size:.9rem;font-weight:750;line-height:1.1}
.ah-title .s{font-size:.62rem;color:var(--txt3);display:flex;align-items:center;gap:5px;margin-top:1px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.off{background:var(--txt3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ah-user{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ah-avatar{width:30px;height:30px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--rebar2);cursor:pointer}
.user-menu{position:absolute;top:52px;right:12px;background:var(--surf2);border:1px solid var(--line);
  border-radius:11px;padding:6px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:60}
.user-menu .um-head{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:5px}
.user-menu .um-name{font-size:.78rem;font-weight:700}
.user-menu .um-email{font-size:.64rem;color:var(--txt3);margin-top:2px;word-break:break-all}
.user-menu button{width:100%;background:transparent;border:none;color:var(--txt2);text-align:left;
  padding:9px 12px;font-size:.76rem;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px}
.user-menu button:active{background:var(--surf3)}
.user-menu button.danger{color:var(--bad)}

main.app-main{flex:1;padding:18px 16px 90px;max-width:760px;margin:0 auto;width:100%}

/* dashboard */
.welcome{margin-bottom:22px}
.welcome h2{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.welcome p{font-size:.82rem;color:var(--txt2);margin-top:3px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dash-card{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:16px;
  cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
.dash-card:active{transform:scale(.98)}
.dash-card .dc-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:1.25rem;margin-bottom:11px}
.dash-card .dc-name{font-size:.86rem;font-weight:700;line-height:1.2}
.dash-card .dc-desc{font-size:.66rem;color:var(--txt3);margin-top:4px;line-height:1.35}
.dash-card .dc-status{position:absolute;top:13px;right:13px;font-size:.54rem;padding:2px 7px;
  border-radius:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.dc-status.ok{background:var(--good-dim,rgba(63,184,115,.14));color:var(--good)}
.dc-status.wip{background:rgba(232,197,71,.14);color:var(--warn)}
.dc-mp .dc-ico{background:var(--rebar-dim);color:var(--rebar2)}
.dc-mo .dc-ico{background:rgba(91,155,213,.12);color:var(--steel)}
.dc-maq .dc-ico{background:rgba(232,197,71,.12);color:var(--warn)}
.dc-frete .dc-ico{background:rgba(63,184,115,.12);color:var(--good)}
.dc-preco{grid-column:1/-1;background:linear-gradient(135deg,var(--rebar-dim),var(--surf));
  border-color:rgba(217,118,66,.3)}
.dc-preco .dc-ico{background:var(--rebar);color:#fff}

.dash-section{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3);
  font-weight:700;margin:26px 0 11px}

/* módulo placeholder */
.module-view{animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mod-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mod-back{width:36px;height:36px;border-radius:9px;background:var(--surf);border:1px solid var(--line);
  color:var(--txt);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mod-header .mh-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:1.2rem;flex-shrink:0}
.mod-header .mh-t{flex:1}
.mod-header .mh-name{font-size:1.05rem;font-weight:750}
.mod-header .mh-tag{font-size:.68rem;color:var(--txt3)}
.placeholder{background:var(--surf);border:1px dashed var(--line);border-radius:14px;padding:34px 22px;text-align:center}
.placeholder .ph-ico{font-size:2.4rem;margin-bottom:12px;opacity:.6}
.placeholder .ph-t{font-size:.92rem;font-weight:700;margin-bottom:6px}
.placeholder .ph-d{font-size:.76rem;color:var(--txt2);line-height:1.5;max-width:380px;margin:0 auto}
.placeholder .ph-badge{display:inline-block;margin-top:14px;font-size:.62rem;color:var(--rebar2);
  background:var(--rebar-dim);padding:4px 11px;border-radius:11px;font-weight:600}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(18,20,26,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px 8px;
  max-width:760px;margin:0 auto}
.nav-item{flex:1;background:transparent;border:none;color:var(--txt3);padding:6px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px;transition:color .12s}
.nav-item .ni-ico{font-size:1.15rem;line-height:1}
.nav-item .ni-lbl{font-size:.56rem;font-weight:600}
.nav-item.active{color:var(--rebar2)}
.nav-item:active{background:var(--surf2)}

/* loading */
#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;gap:16px}
.boot-mark{width:56px;height:56px;background:var(--rebar);border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:1.7rem;animation:pulse 1.2s infinite}
.boot-txt{font-size:.76rem;color:var(--txt3)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surf3);
  border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:11px;font-size:.78rem;
  z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastin .3s;max-width:90%}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== CSS MATÉRIA-PRIMA (do protótipo) ===== */

:root{--bg:#14161b;--surf:#1c1f26;--surf2:#242832;--surf3:#2b303a;--line:#2f343e;
--txt:#e8eaed;--txt2:#989ea8;--txt3:#69707b;--rebar:#d97642;--rebar2:#e8915f;
--good:#3fb873;--warn:#e0a52e;--bad:#d9534f;--blue:#5b9bd5;--purple:#9c8cd5}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:40px}
.mono{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:40;background:rgba(20,22,27,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 16px}
.h-title{font-size:1rem;font-weight:700}
.h-title .badge{background:var(--rebar);color:#fff;font-size:.58rem;padding:2px 7px;border-radius:4px;margin-left:8px;font-weight:600}
.h-sub{font-size:.68rem;color:var(--txt3);margin-top:3px}
.tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--bg);position:sticky;top:60px;z-index:35}
.tab{flex:1;text-align:center;padding:9px 6px;font-size:.75rem;font-weight:600;color:var(--txt2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--txt);border-bottom-color:var(--rebar);background:var(--surf)}
main{padding:16px;max-width:680px;margin:0 auto}
.view{display:none}.view.on{display:block}
.intro{background:var(--surf2);border-left:3px solid var(--rebar);border-radius:6px;padding:11px 13px;font-size:.73rem;color:var(--txt2);line-height:1.55;margin-bottom:12px}
.intro b{color:var(--txt)}
.sect{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--rebar2);font-weight:700;margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* MATERIAL card */
.mat{background:var(--surf);border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.mat-head{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
.mat-exp{font-size:.65rem;color:var(--txt3);transition:transform .2s}
.mat.open .mat-exp{transform:rotate(90deg)}
.mat-nome{flex:1;font-size:.82rem;font-weight:600}
.mat-um{font-size:.58rem;color:var(--txt3);background:var(--surf2);padding:2px 6px;border-radius:3px}
.mat-custo{font-size:.85rem;font-weight:700;color:var(--rebar2);white-space:nowrap}
.mat-body{display:none;padding:0 13px 13px;border-top:1px solid var(--line)}
.mat.open .mat-body{display:block}
.mf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.mf{}
.mf.full{grid-column:1/-1}
.mf label{font-size:.58rem;color:var(--txt3);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.mf input,.mf select{width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:7px 8px;font-size:.78rem;text-align:right}
.mf select{text-align:left}
.mf input:focus{border-color:var(--rebar);outline:none}
.mf.calc input{background:var(--surf3);color:var(--rebar2);border-style:dashed;font-weight:700}
.mf.calc label{color:var(--warn)}
.nf-box{grid-column:1/-1;background:rgba(91,155,213,.07);border:1px solid rgba(91,155,213,.3);border-radius:6px;padding:9px;margin-top:4px}
.nf-box .t{font-size:.62rem;color:var(--blue);font-weight:600;margin-bottom:7px}
.nf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formula{grid-column:1/-1;font-size:.6rem;color:var(--txt3);background:var(--surf2);border-radius:5px;padding:8px 10px;margin-top:8px;line-height:1.5;font-family:ui-monospace,monospace}
.formula b{color:var(--rebar2)}

/* TRAÇO card */
.traco{background:var(--surf);border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
.traco-head{padding:12px 13px;cursor:pointer}
.tr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tr-nome{font-size:.8rem;font-weight:700;flex:1;min-width:0}
.tr-exp{font-size:.62rem;color:var(--txt3);transition:transform .2s;display:inline-block;margin-right:5px}
.traco.open .tr-exp{transform:rotate(90deg)}
.tr-custo{font-size:.92rem;font-weight:800;color:var(--rebar2);white-space:nowrap}
.tr-sub{font-size:.6rem;color:var(--txt3);margin-top:3px}
.tr-body{display:none;border-top:1px solid var(--line);padding:12px 13px;background:var(--surf2)}
.traco.open .tr-body{display:block}
.tr-mat{display:grid;grid-template-columns:1fr 76px 74px;gap:9px;align-items:center;padding:6px 0;font-size:.73rem}
.tr-mat-nome{color:var(--txt2)}
.tr-mat-in{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:6px;font-size:.75rem;text-align:center;font-weight:600}
.tr-mat-in:focus{border-color:var(--rebar);outline:none}
.tr-mat-custo{text-align:right;font-size:.72rem;font-weight:600;color:var(--txt2);white-space:nowrap}
.tr-hdr{display:grid;grid-template-columns:1fr 76px 74px;gap:9px;font-size:.54rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tr-hdr span:nth-child(2),.tr-hdr span:nth-child(3){text-align:center}
.tr-hdr span:nth-child(3){text-align:right}
.tr-total{display:flex;justify-content:space-between;padding-top:9px;margin-top:6px;border-top:1px dashed var(--line);font-size:.75rem}
.tr-total .v{font-weight:800;color:var(--rebar2)}
.tr-peso{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:.72rem}
.tr-peso input{width:88px;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:6px;font-size:.76rem;text-align:center;font-weight:600}
.tr-prods{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.tr-prods .t{font-size:.58rem;color:var(--txt3);text-transform:uppercase;margin-bottom:6px}
.tr-prod-item{display:flex;justify-content:space-between;font-size:.68rem;padding:4px 0;color:var(--txt2)}
.tr-prod-item .c{font-weight:700;color:var(--rebar2);white-space:nowrap}
.tr-prod-more{font-size:.62rem;color:var(--txt3);padding-top:5px;cursor:pointer;text-align:center}
.hidden{display:none}
/* aço/emb */
.ae-filtro{display:flex;gap:6px;margin-bottom:12px}
.ae-filtro button{flex:1;background:var(--surf);border:1px solid var(--line);color:var(--txt2);padding:8px;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer}
.ae-filtro button.on{background:var(--rebar);border-color:var(--rebar);color:#fff}
.aep{background:var(--surf);border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.aep-head{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
.aep-exp{font-size:.62rem;color:var(--txt3);transition:transform .2s}
.aep.open .aep-exp{transform:rotate(90deg)}
.aep-nome{flex:1;font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aep-c{font-size:.82rem;font-weight:700;color:var(--rebar2);white-space:nowrap}
.aep-body{display:none;padding:11px 13px;border-top:1px solid var(--line);background:var(--surf2)}
.aep.open .aep-body{display:block}
.aco-row{display:grid;grid-template-columns:1fr 74px 76px;gap:9px;align-items:center;padding:5px 0;font-size:.72rem}
.aco-lbl{color:var(--txt2)}
.aco-in{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:6px;font-size:.74rem;text-align:center;font-weight:600}
.aco-in:focus{border-color:var(--rebar);outline:none}
.aco-c{text-align:right;font-size:.71rem;font-weight:600;color:var(--txt2)}
.aco-hdr{display:grid;grid-template-columns:1fr 74px 76px;gap:9px;font-size:.53rem;color:var(--txt3);text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:3px}
.aco-hdr span:nth-child(2){text-align:center}.aco-hdr span:nth-child(3){text-align:right}
.aep-tot{display:flex;justify-content:space-between;padding-top:9px;margin-top:6px;border-top:1px dashed var(--line);font-size:.74rem}
.aep-tot .v{font-weight:800;color:var(--rebar2)}
.emb-box{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.emb-t{font-size:.58rem;color:var(--purple);text-transform:uppercase;font-weight:600;margin-bottom:7px}
.pp-row{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;padding:5px 0}
.pp-row input{width:70px;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:6px;font-size:.74rem;text-align:center;font-weight:600}
.sem-item{font-size:.68rem;color:var(--txt3);padding:6px 0}
/* HISTORICO */
.h-sel{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.h-sel::-webkit-scrollbar{display:none}
.h-sel button{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);color:var(--txt2);padding:7px 13px;border-radius:20px;font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap}
.h-sel button.on{background:var(--rebar);border-color:var(--rebar);color:#fff}
.h-mat{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:10px;font-size:.82rem;margin-bottom:12px;font-weight:600}
.chart-card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:11px}
.chart-t{font-size:.78rem;font-weight:700;margin-bottom:2px}
.chart-s{font-size:.63rem;color:var(--txt3);margin-bottom:12px}
.chart-atual{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.ca-v{font-size:1.35rem;font-weight:800;color:var(--rebar2);letter-spacing:-.02em}
.ca-u{font-size:.62rem;color:var(--txt3)}
.ca-d{font-size:.7rem;font-weight:700;margin-left:auto}
.ca-d.up{color:var(--bad)}.ca-d.dn{color:var(--good)}.ca-d.eq{color:var(--txt3)}
.chart{position:relative;height:150px;margin:6px 0 22px 34px}
.ch-grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);opacity:.5}
.ch-ylab{position:absolute;left:-34px;font-size:.53rem;color:var(--txt3);transform:translateY(-50%);width:30px;text-align:right}
.ch-line{position:absolute;inset:0}
.ch-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--rebar);border:2px solid var(--bg);transform:translate(-50%,50%);cursor:pointer;z-index:2}
.ch-dot:hover{width:13px;height:13px}
.ch-xlab{position:absolute;bottom:-19px;font-size:.52rem;color:var(--txt3);transform:translateX(-50%);white-space:nowrap}
.ch-empty{text-align:center;color:var(--txt3);font-size:.72rem;padding:40px 0}
/* lista de compras */
.compras{margin-top:6px}
.compra{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.compra:last-child{border-bottom:none}
.cp-data{font-size:.62rem;color:var(--txt3);white-space:nowrap;text-align:center;line-height:1.25}
.cp-data b{display:block;font-size:.78rem;color:var(--txt);font-weight:700}
.cp-info{min-width:0}
.cp-preco{font-size:.85rem;font-weight:700}
.cp-meta{font-size:.6rem;color:var(--txt3);margin-top:2px}
.cp-var{font-size:.68rem;font-weight:700;white-space:nowrap}
.cp-del{background:transparent;border:none;color:var(--txt3);font-size:.8rem;cursor:pointer;padding:4px 6px}
.cp-del:hover{color:var(--bad)}
.cp-atual{background:rgba(217,118,66,.08);border-left:2px solid var(--rebar);padding-left:9px;margin-left:-11px}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--surf2);border:1px dashed var(--rebar);color:var(--rebar2);font-size:.76rem;font-weight:600;padding:11px;border-radius:8px;cursor:pointer;margin-top:10px}
.btn-add:active{background:var(--surf3)}
/* form nova compra */
.form-nc{background:var(--surf2);border:1px solid var(--rebar);border-radius:9px;padding:13px;margin-top:10px;display:none}
.form-nc.on{display:block}
.fnc-t{font-size:.72rem;font-weight:700;color:var(--rebar2);margin-bottom:11px}
.fnc-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fnc-f{}
.fnc-f.full{grid-column:1/-1}
.fnc-f label{font-size:.57rem;color:var(--txt3);display:block;margin-bottom:3px;text-transform:uppercase}
.fnc-f input{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:8px;font-size:.78rem}
.fnc-f input[type=number]{text-align:right}
.fnc-btns{display:flex;gap:8px;margin-top:11px}
.fnc-btns button{flex:1;padding:9px;border-radius:6px;font-size:.74rem;font-weight:600;cursor:pointer;border:none}
.btn-ok{background:var(--rebar);color:#fff}
.btn-cx{background:var(--surf3);color:var(--txt2)}
/* impacto */
.imp-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.73rem}
.imp-row:last-child{border-bottom:none}
.imp-n{color:var(--txt2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-v{font-weight:700;white-space:nowrap;margin-left:10px}
.imp-d{font-size:.64rem;font-weight:700;white-space:nowrap;margin-left:8px;min-width:48px;text-align:right}
.note{font-size:.65rem;color:var(--txt3);margin-top:16px;line-height:1.55}

/* tooltip de ajuda */
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--surf3);color:var(--txt3);font-size:.62rem;font-weight:700;cursor:pointer;margin-left:5px;vertical-align:middle;flex-shrink:0;border:1px solid var(--line)}
.help:active{background:var(--rebar);color:#fff}
.help-pop{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:100;background:var(--surf2);border:1px solid var(--rebar);border-radius:10px;padding:15px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:648px;margin:0 auto}
.help-pop.on{display:block}
.help-pop h4{font-size:.82rem;color:var(--rebar2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.help-pop .x{background:var(--surf3);border:none;color:var(--txt2);width:24px;height:24px;border-radius:6px;font-size:.9rem;cursor:pointer}
.help-pop p{font-size:.73rem;color:var(--txt);line-height:1.6;margin-bottom:8px}
.help-pop p:last-child{margin-bottom:0}
.help-pop b{color:var(--rebar2)}
.help-pop .ex{background:var(--surf3);border-radius:6px;padding:9px 11px;font-size:.68rem;color:var(--txt2);line-height:1.5;margin-top:8px}
.help-backdrop{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.5)}
.help-backdrop.on{display:block}

</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="boot-mark">🏗️</div>
  <div class="boot-txt">Carregando…</div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="hidden">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">🏗️</div>
      <h1>Motor de Custos</h1>
      <div class="sub">Artefatos de Cimento Pedroni</div>
    </div>
    <div class="login-card">

<!-- APP -->
<div id="app-screen" class="hidden">
  <div class="app-header">
    <div class="ah-mark">🏗️</div>
    <div class="ah-title">
      <div class="t">Motor de Custos</div>
      <div class="s"><span class="sync-dot" id="sync-dot"></span><span id="sync-txt">Sincronizado</span></div>

    <button class="nav-item" data-nav="mp"><span class="ni-ico">🧱</span><span class="ni-lbl">Material</span></button>

    <button class="nav-item" data-nav="maq"><span class="ni-ico">⚙️</span><span class="ni-lbl">Máquina</span></button>
    <button class="nav-item" data-nav="frete"><span class="ni-ico">🚚</span><span class="ni-lbl">Frete</span></button>
  </nav>
</div>

<script type="module">
// ===================================================================
// CONTROLE DE ACESSO
// LOGIN_ATIVO = false → app abre direto, sem tela de login (modo atual)
// LOGIN_ATIVO = true  → exige email/senha (basta trocar aqui pra religar)
// Todo o código de login continua pronto abaixo — só está desativado.
// ===================================================================
const LOGIN_ATIVO = false;

// ===================================================================
// CONFIGURAÇÃO DO FIREBASE
// Usa o MESMO projeto do app FROTA (gestao-de-frota-pedroni).
// Os dados de custos ficam num ramo separado do banco: /custos
// >>> Cole aqui as credenciais do seu projeto Firebase <<<
// (Console Firebase > Configurações do projeto > Seus apps > Config)
// ===================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBqX8iLAtPTPHMIIHEBg3sGsDPVdHKq24U",
  authDomain: "gestao-de-frota-pedroni.firebaseapp.com",
  databaseURL: "https://gestao-de-frota-pedroni-default-rtdb.firebaseio.com",
  projectId: "gestao-de-frota-pedroni",
  storageBucket: "gestao-de-frota-pedroni.firebasestorage.app",
  messagingSenderId: "248388581510",
  appId: "1:248388581510:web:5ccbb96ae9b75c8af8f907"
};

// Detecta se as credenciais foram preenchidas
const CONFIG_OK = !firebaseConfig.apiKey.includes("COLE_AQUI");

// Carrega o Firebase dinamicamente. Se o CDN não carregar (offline, ou
// ambiente sem rede), o app cai no MODO DEMO em vez de travar.
let auth=null, db=null, fb=null;
let FIREBASE_OK = false;

async function loadFirebase(){
  if(!CONFIG_OK) return false;
  try{
    const [appMod, authMod, dbMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
    ]);
    const fbApp = appMod.initializeApp(firebaseConfig);
    auth = authMod.getAuth(fbApp);
    db = dbMod.getDatabase(fbApp);
    fb = {
      signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
      createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
      signOut: authMod.signOut,
      onAuthStateChanged: authMod.onAuthStateChanged,
      ref: dbMod.ref, onValue: dbMod.onValue, set: dbMod.set,
      serverTimestamp: dbMod.serverTimestamp,
    };
    return true;
  }catch(err){
    console.warn("Firebase não carregou, entrando em modo demo:", err.message);
    return false;
  }
}

// ===================================================================
// ESTADO
// ===================================================================
let currentUser = null;
let currentNav = "home";

const $ = id => document.getElementById(id);

// ===================================================================
// MODO DEMO (sem Firebase) — permite ver o app funcionando localmente
// ===================================================================
let DEMO = true;  // definido no boot conforme o Firebase carrega
let demoUser = null;

// ===================================================================
// AUTENTICAÇÃO
// ===================================================================
async function initAuth(){
  FIREBASE_OK = await loadFirebase();
  DEMO = !FIREBASE_OK;

  // Login desativado: abre direto no app com um usuário local padrão.
  if(!LOGIN_ATIVO){
    $("boot").classList.add("hidden");
    currentUser = { email:"pedroni@local", uid:"local", displayName:"Pedroni" };
    showApp();
    return;
  }

  if(DEMO){
    // sem Firebase: pula direto pra tela de login em modo demo
    $("boot").classList.add("hidden");
    showLogin();
    setDemoNotice();
    return;
  }
  fb.onAuthStateChanged(auth, user => {
    $("boot").classList.add("hidden");
    if(user){
      currentUser = user;
      showApp();
    } else {
      currentUser = null;
      showLogin();
    }
  });
}

function setDemoNotice(){
  $("login-hint").innerHTML = 'Modo demonstração — Firebase não configurado. <br>Entre com qualquer email/senha para explorar.';
}

let signupMode = false;
$("toggle-signup").addEventListener("click", ()=>{
  signupMode = !signupMode;
  $("login-title").textContent = signupMode ? "Criar conta" : "Entrar";
  $("login-btn").textContent = signupMode ? "Criar conta" : "Entrar";
  $("login-foot").innerHTML = signupMode
    ? 'Já tem conta? <a id="toggle-signup">Entrar</a>'
    : 'Primeiro acesso? <a id="toggle-signup">Criar conta</a>';
  // re-bind (innerHTML recriou o elemento)
  $("toggle-signup").addEventListener("click", arguments.callee);
  $("login-msg").textContent = "";
});

$("login-btn").addEventListener("click", doLogin);
$("login-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

async function doLogin(){
  const email = $("login-email").value.trim();
  const pass = $("login-pass").value;
  const msg = $("login-msg");
  msg.className = "login-msg";
  if(!email || !pass){ msg.textContent="Preencha email e senha."; msg.className="login-msg err"; return; }

  if(DEMO){
    demoUser = { email, uid:"demo", displayName:email.split("@")[0] };
    currentUser = demoUser;
    showApp();
    return;
  }

  $("login-btn").disabled = true;
  $("login-btn").textContent = signupMode ? "Criando…" : "Entrando…";
  try{
    if(signupMode){
      await fb.createUserWithEmailAndPassword(auth, email, pass);
      msg.textContent = "Conta criada! Entrando…"; msg.className="login-msg ok";
    } else {
      await fb.signInWithEmailAndPassword(auth, email, pass);
    }
  }catch(err){
    msg.className = "login-msg err";
    msg.textContent = authError(err.code);
    $("login-btn").disabled = false;
    $("login-btn").textContent = signupMode ? "Criar conta" : "Entrar";
  }
}

function authError(code){
  const m = {
    "auth/invalid-email":"Email inválido.",
    "auth/user-not-found":"Usuário não encontrado. Crie uma conta.",
    "auth/wrong-password":"Senha incorreta.",
    "auth/invalid-credential":"Email ou senha incorretos.",
    "auth/email-already-in-use":"Este email já tem conta. Faça login.",
    "auth/weak-password":"Senha muito curta (mínimo 6 caracteres).",
    "auth/too-many-requests":"Muitas tentativas. Aguarde um momento.",
    "auth/network-request-failed":"Sem conexão. Verifique a internet."
  };
  return m[code] || "Erro ao entrar. Tente novamente.";
}

// ===================================================================
// TELAS
// ===================================================================
function showLogin(){
  $("login-screen").classList.remove("hidden");
  $("app-screen").classList.add("hidden");
}
function showApp(){
  $("login-screen").classList.add("hidden");
  $("app-screen").classList.remove("hidden");
  const name = currentUser.displayName || currentUser.email.split("@")[0];
  const initials = name.slice(0,2).toUpperCase();
  $("user-avatar").textContent = initials;
  updateSync(DEMO ? "off" : "ok");
  renderNav();
}

// ===================================================================
// MENU DO USUÁRIO
// ===================================================================
let userMenuOpen = false;
$("user-avatar").addEventListener("click", toggleUserMenu);
function toggleUserMenu(){
  if(userMenuOpen){ closeUserMenu(); return; }
  const name = currentUser.displayName || currentUser.email.split("@")[0];
  const menu = document.createElement("div");
  menu.className = "user-menu"; menu.id="user-menu";
  menu.innerHTML = `
    <div class="um-head">
      <div class="um-name">${name}</div>
      <div class="um-email">${LOGIN_ATIVO ? currentUser.email : "acesso sem login"}</div>
    </div>
    ${LOGIN_ATIVO ? '<button id="menu-signout" class="danger">↩ Sair</button>' : '<button id="menu-info">ℹ Sobre o app</button>'}`;
  $("app-screen").appendChild(menu);
  if(LOGIN_ATIVO){
    $("menu-signout").addEventListener("click", doLogout);
  } else {
    $("menu-info").addEventListener("click", ()=>{ closeUserMenu(); currentNav="home"; renderNav(); window.scrollTo(0,0); });
  }
  userMenuOpen = true;
  setTimeout(()=>document.addEventListener("click", outsideMenu), 10);
}
function outsideMenu(e){
  if(!e.target.closest("#user-menu") && !e.target.closest("#user-avatar")) closeUserMenu();
}
function closeUserMenu(){
  const m = $("user-menu"); if(m) m.remove();
  userMenuOpen = false;
  document.removeEventListener("click", outsideMenu);
}
async function doLogout(){
  closeUserMenu();
  if(DEMO){ demoUser=null; currentUser=null; showLogin(); return; }
  await fb.signOut(auth);
}

// ===================================================================
// SINCRONIZAÇÃO (indicador)
// ===================================================================
function updateSync(state){
  const dot = $("sync-dot"), txt = $("sync-txt");
  dot.className = "sync-dot" + (state==="syncing"?" syncing":state==="off"?" off":"");
  txt.textContent = state==="syncing" ? "Salvando…" : state==="off" ? "Modo local" : "Sincronizado";
}

// ===================================================================
// NAVEGAÇÃO
// ===================================================================
document.querySelectorAll(".nav-item").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentNav = btn.dataset.nav;
    document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b===btn));
    renderNav();
    window.scrollTo(0,0);
  });
});

const MODULES = {
  mp:   { ico:"🧱", cls:"dc-mp",    name:"Matéria-prima",   tag:"Custo do concreto por produto",  status:"ok",  desc:"Traços, aço, embalagem e histórico de preços." },
  mo:   { ico:"👷", cls:"dc-mo",    name:"Mão de obra",     tag:"Custo/hora por setor",           status:"ok",  desc:"Encargos, 7 setores, EPI por consumo." },
  maq:  { ico:"⚙️", cls:"dc-maq",   name:"Custo de máquina",tag:"Energia, depreciação, gastos",   status:"wip", desc:"Energia calibrada; faltam potências e produção." },
  frete:{ ico:"🚚", cls:"dc-frete", name:"Frete e admin",   tag:"Custos fixos rateados",          status:"wip", desc:"Faturamento real; falta combustível da frota." },
};

function renderNav(){
  if(currentNav === "home") renderHome();
  else renderModule(currentNav);
  syncNavButtons();
}
function syncNavButtons(){
  document.querySelectorAll(".nav-item").forEach(b=>
    b.classList.toggle("active", b.dataset.nav===currentNav));
}

function renderHome(){
  const name = (currentUser.displayName || currentUser.email.split("@")[0]);
  const firstName = name.split(/[.\s]/)[0];
  const cap = firstName.charAt(0).toUpperCase()+firstName.slice(1);
  const m = MODULES;
  $("app-main").innerHTML = `
    <div class="welcome">
      <h2>Olá, ${cap}</h2>
      <p>Seu motor de custos, tudo num lugar só.</p>
    </div>
    <div class="dash-grid">
      ${moduleCard("mp",m.mp)}
      ${moduleCard("mo",m.mo)}
      ${moduleCard("maq",m.maq)}
      ${moduleCard("frete",m.frete)}
      <div class="dash-card dc-preco" data-go="preco">
        <div class="dc-ico">🏷️</div>
        <div class="dc-name">Preço final</div>
        <div class="dc-desc">Junta os 4 módulos e mostra o preço de cada produto — com e sem nota.</div>
      </div>
    </div>
    <div class="dash-section">Sobre este app</div>
    <div class="placeholder" style="padding:20px">
      <div class="ph-d" style="text-align:left">
        Esta é a <b style="color:var(--txt)">fundação do app</b> — login e navegação prontos, conectados ao banco de dados.
        Os módulos ainda mostram os cálculos nos protótipos separados; nas próximas etapas eles entram aqui,
        com tudo salvando de verdade e a produção conectando os quatro.
      </div>
    </div>`;
  // liga os cards
  document.querySelectorAll("[data-go]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const dest = c.dataset.go;
      if(dest==="preco"){ toast("Preço final chega na última etapa 🏷️"); return; }
      currentNav = dest; renderNav(); window.scrollTo(0,0);
    });
  });
}

function moduleCard(key, m){
  return `<div class="dash-card ${m.cls}" data-go="${key}">
    <div class="dc-status ${m.status}">${m.status==="ok"?"pronto":"em breve"}</div>
    <div class="dc-ico">${m.ico}</div>
    <div class="dc-name">${m.name}</div>
    <div class="dc-desc">${m.desc}</div>
  </div>`;
}

function renderModule(key){
  const m = MODULES[key];
  if(!m){ renderHome(); return; }
  if(key === "mp"){
    $("app-main").innerHTML = '<div id="mp-container" class="module-view"></div>';
    initMateriaPrima($("mp-container"));
    return;
  }
  $("app-main").innerHTML = `
    <div class="module-view">
      <div class="mod-header">
        <button class="mod-back" data-back>‹</button>
        <div class="mh-ico ${m.cls.replace('dc-','dc-')}" style="background:var(--rebar-dim);color:var(--rebar2)">${m.ico}</div>
        <div class="mh-t">
          <div class="mh-name">${m.name}</div>
          <div class="mh-tag">${m.tag}</div>
        </div>
      </div>
      <div class="placeholder">
        <div class="ph-ico">${m.ico}</div>
        <div class="ph-t">Módulo pronto para entrar aqui</div>
        <div class="ph-d">
          Os cálculos deste módulo já estão validados no protótipo.
          Na próxima etapa ele é integrado ao app, com os dados salvando na nuvem
          e sincronizando entre seus dispositivos.
        </div>
        <div class="ph-badge">${m.status==="ok" ? "Cálculos validados ✓" : "Aguardando alguns dados"}</div>
      </div>
    </div>`;
  document.querySelector("[data-back]").addEventListener("click", ()=>{
    currentNav="home"; renderNav(); window.scrollTo(0,0);
  });
}

// ===================================================================
// TOAST
// ===================================================================
let toastTimer=null;
function toast(msg){
  const old=$("toast"); if(old) old.remove();
  const t=document.createElement("div");
  t.className="toast"; t.id="toast"; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(), 2600);
}


// ===================================================================
// CAMADA DE PERSISTÊNCIA (Firebase Realtime Database)
// Salva automático quando os dados mudam; carrega ao abrir.
// Cai em localStorage se o Firebase não estiver disponível (demo).
// ===================================================================
const Persist = {
  db: null, fb: null, base: null, demo: true, _timer: null, _onSync: null,

  init(db, fb, basePath, onSync){
    this.db = db; this.fb = fb; this.base = basePath; this.demo = !db;
    this._onSync = onSync || (()=>{});
  },

  // carrega os dados salvos; retorna null se não houver
  async load(key){
    const path = this.base + '/' + key;
    if(this.demo){
      try{ const v = localStorage.getItem('pedroni:'+path); return v?JSON.parse(v):null; }
      catch(e){ return null; }
    }
    try{
      const snap = await new Promise((res,rej)=>{
        this.fb.onValue(this.fb.ref(this.db, path), s=>res(s), rej, {onlyOnce:true});
      });
      return snap.exists() ? snap.val() : null;
    }catch(e){ console.warn('load falhou:', e.message); return null; }
  },

  // salva (com debounce pra não gravar a cada tecla)
  save(key, data){
    const path = this.base + '/' + key;
    this._onSync('syncing');
    clearTimeout(this._timer);
    this._timer = setTimeout(async ()=>{
      if(this.demo){
        try{ localStorage.setItem('pedroni:'+path, JSON.stringify(data)); this._onSync('ok'); }
        catch(e){ this._onSync('off'); }
        return;
      }
      try{
        await this.fb.set(this.fb.ref(this.db, path), data);

function salvarMP(){
  if(!D || !mpReady) return;
  Persist.save('materia_prima', D);
}

async function initMateriaPrima(container){
  mpReady = false;
  // carrega dados salvos, ou usa o padrão na primeira vez
  const saved = await Persist.load('materia_prima');
  D = saved || JSON.parse(JSON.stringify(D_DEFAULT));

}

const AJUDAS={

    <p>É esse valor que entra no cálculo dos traços.</p>`},

    <div class="ex">Areia natural: você paga R$ 147/m³ mas a nota é de R$ 90. O crédito vale só sobre os R$ 90 — o app calcula isso automaticamente.</div>`},

  pesobatida:{t:'Peso da batida',c:`<p>O peso total de uma batida de concreto (soma de todos os materiais). Usado pra calcular o custo por peça:</p>

const matOpen={}, tracoOpen={}, prodExp={};

const fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

const fmt3=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});

// ---- custo unitário de um material ----
function custoUnit(m){
  const F=m.precoCompra||0;     // preço realmente pago (por unid. compra)
  const G=m.precoNF||0;         // preço que consta na nota fiscal
  const H=m.qtdeNF||0;          // qtde na nota
  const I=m.qtdeReal||0;        // qtde real recebida
  const J=m.credito||0;         // % crédito
  const div=m.divisor||1;
  let liquido;
  // Nota parcial: crédito proporcional ao valor que tem nota
  // replica planilha: F - ((((H*G)/(I*F))*J)*G)
  if(H>0 && I>0 && G>0 && F>0){
    const fracComNota = (H*G)/(I*F);
    liquido = F - (fracComNota*J*G);
  } else {
    liquido = F - (F*J);
  }
  return div>0 ? liquido/div : 0;
}

// ---- render materiais ----
function renderMat(lista, containerId, prefix){
  const wrap=document.getElementById(containerId); wrap.innerHTML='';
  lista.forEach((m,i)=>{
    const id=prefix+i;
    const cu=custoUnit(m);
    const div=document.createElement('div');
    div.className='mat'+(matOpen[id]?' open':'');
    // HEAD
    const head=document.createElement('div');head.className='mat-head';
    head.innerHTML=`<span class="mat-exp">▶</span><span class="mat-nome">${m.nome}</span><span class="mat-um">R$/${m.um}</span><span class="mat-custo mono">${fmt4(cu)}</span>`;
    head.onclick=()=>{matOpen[id]=!matOpen[id];renderAll();};
    div.appendChild(head);
    // BODY
    const body=document.createElement('div');body.className='mat-body';
    const g=document.createElement('div');g.className='mf-grid';
    // preço compra
    const f1=document.createElement('div');f1.className='mf';
    f1.innerHTML=`<label>Preço compra (por ${m.unidCompra}) ${helpIcon('precocompra')}</label>`;
    const i1=document.createElement('input');i1.type='number';i1.step='0.01';i1.value=m.precoCompra;
    i1.oninput=()=>{m.precoCompra=parseFloat(i1.value)||0;refreshMat(div,m);};
    f1.appendChild(i1);g.appendChild(f1);
    // crédito
    const f2=document.createElement('div');f2.className='mf';
    f2.innerHTML=`<label>% Crédito imposto ${helpIcon('credito')}</label>`;
    const i2=document.createElement('input');i2.type='number';i2.step='0.25';i2.value=(m.credito*100).toFixed(2);
    i2.oninput=()=>{m.credito=(parseFloat(i2.value)||0)/100;refreshMat(div,m);};
    f2.appendChild(i2);g.appendChild(f2);
    // divisor
    const f3=document.createElement('div');f3.className='mf';
    f3.innerHTML=`<label>Divisor (${m.unidCompra}→${m.um}) ${helpIcon('divisor')}</label>`;
    const i3=document.createElement('input');i3.type='number';i3.value=m.divisor;
    i3.oninput=()=>{m.divisor=parseFloat(i3.value)||1;refreshMat(div,m);};
    f3.appendChild(i3);g.appendChild(f3);
    // custo unit calculado

function formulaTxt(m){
  const cu=custoUnit(m);
  const cred=(m.credito*100).toFixed(2);
  if(m.qtdeNF>0&&m.qtdeReal>0&&m.precoNF>0){
    const frac=((m.qtdeNF*m.precoNF)/(m.qtdeReal*m.precoCompra)*100).toFixed(0);
    return `Só ${frac}% do valor tem nota → crédito de ${cred}% sobre essa parte.<br>(${fmt(m.precoCompra)} − crédito) ÷ ${m.divisor} = <b>R$ ${fmt4(cu)}/${m.um}</b>`;
  }
  return `(${fmt(m.precoCompra)} − ${cred}%) ÷ ${m.divisor} = <b>R$ ${fmt4(cu)}/${m.um}</b>`;
}

const ACO_TIPOS=['MF-113','MF-196','MF-283','PB-138','PB-196','PB-283','Q-138','Q-238','L-246'];
const EMB_TIPOS=['Filme Strech','Fita PET','Selo','Palete'];

function custoAco(p){
  let t=0;
  ACO_TIPOS.forEach(k=>{ t += (p.aco?.[k]||0) * (D.precosAco[k]||0); });
  return t + (p.moAcoTubo||0);
}
function custoEmb(p){
  const pp = p.pecasPalete||0;
  if(pp<=0) return 0;
  // custo do palete + selos + fitas + filme, tudo dividido pelas peças do palete
  const custoPalete = D.precosEmb['Palete']||0;
  const custoSelos  = (p.qtdeSelo||0)  * (D.precosEmb['Selo']||0);
  const custoFitas  = (p.qtdeFita||0)  * (D.precosEmb['Fita PET']||0);
  const custoFilme  = (p.qtdeFilme||0) * (D.precosEmb['Filme Strech']||0);
  return (custoPalete + custoSelos + custoFitas + custoFilme) / pp;
}

function embDetalhe(p){

// ================= HISTÓRICO =================
let hNivel='material', hItem=null, formOpen=false;
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// mapa: chave do material -> objeto do material
function matPorChave(k){
  if(k.startsWith('aco_')) return D.aco[+k.slice(4)];
  if(k.startsWith('emb_')) return D.embalagem[+k.slice(4)];
  return D.agregados[k];
}
function nomeMat(k){ const m=matPorChave(k); return m?m.nome:k; }
function todasChaves(){
  return [...KEYS, ...D.aco.map((_,i)=>'aco_'+i), ...D.embalagem.map((_,i)=>'emb_'+i)];
}
// compras ordenadas por data (mais recente primeiro)
function comprasDe(k){
  const c=D.compras[k]||[];
  return [...c].sort((a,b)=>b.data.localeCompare(a.data));
}
// preço vigente = última compra
function precoVigente(k){
  const c=comprasDe(k);
  return c.length? c[0].preco : 0;
}
// aplica o preço vigente ao material (pra que o custo use sempre a última compra)
function sincronizarPrecos(){
  todasChaves().forEach(k=>{
    const c=comprasDe(k);
    if(!c.length) return;
    const m=matPorChave(k);
    if(!m) return;
    m.precoCompra=c[0].preco;
    if(c[0].precoNF!==undefined && c[0].precoNF>0){
      m.precoNF=c[0].precoNF; m.qtdeNF=c[0].qtdeNF; m.qtdeReal=c[0].qtdeReal;
    }
  });
}
// custo unitário numa data (usa a compra vigente naquela data)
function custoUnitEm(k,dataISO){
  const c=comprasDe(k).filter(x=>x.data<=dataISO);
  if(!c.length) return 0;
  const compra=c[0]; // mais recente até aquela data
  const m=matPorChave(k);
  if(!m) return 0;
  const tmp={...m, precoCompra:compra.preco};
  if(compra.precoNF>0){ tmp.precoNF=compra.precoNF; tmp.qtdeNF=compra.qtdeNF; tmp.qtdeReal=compra.qtdeReal; }
  return custoUnit(tmp);
}
// custo do traço numa data
function custoTracoEm(t,dataISO){
  let tot=0;
  KEYS.forEach(k=>{ tot += (t.materiais[k]||0) * custoUnitEm(k,dataISO); });
  return tot;
}
// custo por peça de um produto numa data (MP + aço + emb)
function custoProdutoEm(p,dataISO){
  const t=D.tracos[p.traco];
  let mp=0;
  if(t && t.pesoTraco>0) mp=(custoTracoEm(t,dataISO)/t.pesoTraco)*p.pesoPeca;
  // aço
  let aco=0;
  if(p.aco) Object.keys(p.aco).forEach((tipo,i)=>{
    const idx=ACO_TIPOS.indexOf(tipo);
    if(idx>=0) aco += (p.aco[tipo]||0) * custoUnitEm('aco_'+idx,dataISO);
  });
  aco += (p.moAcoTubo||0);
  // embalagem
  let emb=0;
  if(p.pecasPalete>0){
    const cPal=custoUnitEm('emb_3',dataISO)*(D.embalagem[3].divisor||1); // palete (preço direto)
    const cSel=custoUnitEm('emb_2',dataISO)*(D.embalagem[2].divisor||1);
    const cFit=custoUnitEm('emb_1',dataISO)*(D.embalagem[1].divisor||1);
    const cFil=custoUnitEm('emb_0',dataISO)*(D.embalagem[0].divisor||1);
    emb=(cPal + (p.qtdeSelo||0)*cSel + (p.qtdeFita||0)*cFit + (p.qtdeFilme||0)*cFil)/p.pecasPalete;
  }
  return mp+aco+emb;
}
// todas as datas de compra relevantes (para plotar)
function datasRelevantes(chaves){
  const s=new Set();
  chaves.forEach(k=>(D.compras[k]||[]).forEach(c=>s.add(c.data)));
  return [...s].sort();
}
function fmtData(iso){
  const [y,m,dd]=iso.split('-');
  return dd+'/'+m;
}
function fmtDataLonga(iso){
  const [y,m,dd]=iso.split('-');
  return dd+' '+MESES[+m-1]+' '+y.slice(2);
}

// ---- GRÁFICO (SVG puro) ----
function grafico(pontos, unidade, casas){
  if(pontos.length<1) return '<div class="ch-empty">Sem dados ainda.</div>';
  const vals=pontos.map(p=>p.v);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min=min*0.9; max=max*1.1||1; }
  const range=max-min;
  min-=range*0.12; max+=range*0.12;
  const H=150;
  // eixo Y (3 linhas)
  let grid='';
  for(let i=0;i<=2;i++){
    const v=min+(max-min)*(i/2);
    const y=H-(i/2)*H;
    grid+=`<div class="ch-grid" style="top:${y}px"></div>
           <div class="ch-ylab" style="top:${y}px">${fmt(v)}</div>`;
  }
  // pontos e linha (escada — preço vale até a próxima compra)
  const n=pontos.length;
  const px=(i)=> n>1 ? (i/(n-1))*100 : 50;
  const py=(v)=> ((v-min)/(max-min))*100;
  let path='';
  pontos.forEach((p,i)=>{
    const x=px(i), y=100-py(p.v);
    if(i===0) path+=`M ${x} ${y}`;
    else{
      const xPrev=px(i-1);
      const yPrev=100-py(pontos[i-1].v);
      path+=` L ${x} ${yPrev} L ${x} ${y}`;  // escada
    }
  });
  let dots='', labs='';
  pontos.forEach((p,i)=>{
    dots+=`<div class="ch-dot" style="left:${px(i)}%;bottom:${py(p.v)}%" title="${fmtDataLonga(p.d)}: ${fmt(p.v)}"></div>`;
    if(n<=8 || i===0 || i===n-1 || i%Math.ceil(n/5)===0)
      labs+=`<div class="ch-xlab" style="left:${px(i)}%">${fmtData(p.d)}</div>`;
  });
  return `<div class="chart">
    ${grid}
    <svg class="ch-line" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="${path}" fill="none" stroke="var(--rebar)" stroke-width="0.7" vector-effect="non-scaling-stroke"/>
    </svg>
    ${dots}${labs}
  </div>`;
}

// ---- RENDER PRINCIPAL ----
function renderHist(){ if(mpReady) salvarMP();
  sincronizarPrecos();
  const wrap=document.getElementById('h-conteudo');
  let pontos=[], atual=0, unidade='', titulo='', sub='';

  if(hNivel==='material'){
    const k=hItem;
    const m=matPorChave(k);
    if(!m){wrap.innerHTML='';return;}
    const cs=comprasDe(k).slice().reverse();
    pontos=cs.map(c=>{
      const tmp={...m,precoCompra:c.preco};
      if(c.precoNF>0){tmp.precoNF=c.precoNF;tmp.qtdeNF=c.qtdeNF;tmp.qtdeReal=c.qtdeReal;}
      return {d:c.data, v:custoUnit(tmp), preco:c.preco, c};
    });
    atual=pontos.length?pontos[pontos.length-1].v:0;
    unidade='R$/'+m.um;
    titulo=m.nome; sub='custo unitário por compra';
  } else if(hNivel==='traco'){
    const t=D.tracos[+hItem];
    const datas=datasRelevantes(KEYS);
    pontos=datas.map(d=>({d, v:custoTracoEm(t,d)}));
    atual=pontos.length?pontos[pontos.length-1].v:0;
    unidade='R$/batida'; titulo=t.nome; sub=`custo da batida de ${fmt0(t.pesoTraco)} kg`;
  } else {
    const p=D.produtos[+hItem];
    const chaves=[...KEYS, ...D.aco.map((_,i)=>'aco_'+i), ...D.embalagem.map((_,i)=>'emb_'+i)];
    const datas=datasRelevantes(chaves);
    pontos=datas.map(d=>({d, v:custoProdutoEm(p,d)}));
    atual=pontos.length?pontos[pontos.length-1].v:0;
    unidade='R$/peça'; titulo=p.nome; sub='custo de matéria-prima por peça';
  }

  // variação
  const primeiro=pontos.length?pontos[0].v:0;
  const varPct = primeiro>0 ? (atual-primeiro)/primeiro : 0;
  const cls = Math.abs(varPct)<0.005?'eq':(varPct>0?'up':'dn');
  const seta = Math.abs(varPct)<0.005?'':(varPct>0?'▲':'▼');

  let html=`<div class="chart-card">
    <div class="chart-t">${titulo}</div>
    <div class="chart-s">${sub}</div>
    <div class="chart-atual">
      <span class="ca-v mono">R$ ${fmt(atual)}</span>
      <span class="ca-u">${unidade}</span>
      ${pontos.length>1?`<span class="ca-d ${cls}">${seta} ${varPct>0?'+':''}${(varPct*100).toFixed(1)}%</span>`:''}
    </div>
    ${grafico(pontos, unidade)}
  </div>`;

  // lista de compras (só no nível material)
  if(hNivel==='material'){
    const k=hItem;
    const cs=comprasDe(k);
    html+=`<div class="chart-card">
      <div class="chart-t">Compras registradas</div>
      <div class="chart-s">o preço vigente é o da compra mais recente</div>
      <div class="compras" id="lista-compras"></div>
      <button class="btn-add" id="btn-nc">+ Registrar nova compra</button>
      <div class="form-nc${formOpen?' on':''}" id="form-nc">
        <div class="fnc-t">Nova compra — ${nomeMat(k)}</div>
        <div class="fnc-g">
          <div class="fnc-f"><label>Data</label><input type="date" id="nc-data" value="${D.hoje}"></div>
          <div class="fnc-f"><label>Preço (R$/${matPorChave(k).unidCompra})</label><input type="number" id="nc-preco" step="0.01" placeholder="0,00"></div>
          <div class="fnc-f"><label>Quantidade</label><input type="number" id="nc-qtde" step="0.01" placeholder="0"></div>
          <div class="fnc-f"><label>Fornecedor</label><input type="text" id="nc-forn" placeholder="opcional"></div>
        </div>
        <div class="fnc-btns">
          <button class="btn-cx" id="nc-cancel">Cancelar</button>
          <button class="btn-ok" id="nc-save">Salvar compra</button>
        </div>
      </div>
    </div>`;
  }

  // impacto (nível traço e produto)
  if(hNivel==='traco'){
    const t=D.tracos[+hItem];
    html+=`<div class="chart-card">
      <div class="chart-t">Composição do custo</div>
      <div class="chart-s">quanto cada material pesa nesta batida</div>`;
    const ct=custoTraco(t);
    KEYS.forEach(k=>{
      const q=t.materiais[k]||0;
      if(!q) return;
      const c=q*custoUnit(D.agregados[k]);
      const pct=ct>0?c/ct*100:0;
      html+=`<div class="imp-row">
        <span class="imp-n">${LBL[k]} <span style="font-size:.58rem;color:var(--txt3)">${fmt0(q)} ${D.agregados[k].um}</span></span>
        <span class="imp-v mono">R$ ${fmt(c)}</span>
        <span class="imp-d" style="color:var(--txt3)">${pct.toFixed(0)}%</span>
      </div>`;
    });
    html+='</div>';
  }

  wrap.innerHTML=html;

  // eventos do form
  if(hNivel==='material'){
    renderListaCompras(hItem);
    const btn=document.getElementById('btn-nc');
    if(btn) btn.onclick=()=>{formOpen=true;document.getElementById('form-nc').classList.add('on');};
    const cx=document.getElementById('nc-cancel');
    if(cx) cx.onclick=()=>{formOpen=false;document.getElementById('form-nc').classList.remove('on');};
    const sv=document.getElementById('nc-save');
    if(sv) sv.onclick=()=>salvarCompra(hItem);
  }
}
function renderListaCompras(k){
  const box=document.getElementById('lista-compras');
  if(!box) return;
  const cs=comprasDe(k);
  const m=matPorChave(k);
  box.innerHTML='';
  cs.forEach((c,i)=>{
    const anterior = cs[i+1];
    const varP = anterior && anterior.preco>0 ? (c.preco-anterior.preco)/anterior.preco : null;
    const div=document.createElement('div');
    div.className='compra'+(i===0?' cp-atual':'');
    const [y,mo,dd]=c.data.split('-');
    let varTxt='';
    if(varP!==null){
      const cl=Math.abs(varP)<0.005?'cmp-eq':(varP>0?'cmp-up':'cmp-dn');
      const st=Math.abs(varP)<0.005?'≈':(varP>0?'▲':'▼');
      varTxt=`<span class="cp-var ${cl}">${st} ${varP>0?'+':''}${(varP*100).toFixed(1)}%</span>`;
    } else varTxt='<span class="cp-var" style="color:var(--txt3);font-size:.6rem">1ª</span>';
    div.innerHTML=`
      <div class="cp-data"><b>${dd}/${mo}</b>${y.slice(2)}</div>
      <div class="cp-info">
        <div class="cp-preco mono">R$ ${fmt(c.preco)} <span style="font-size:.6rem;color:var(--txt3);font-weight:400">/${m.unidCompra}</span>
          ${i===0?'<span style="font-size:.52rem;background:var(--rebar);color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px">VIGENTE</span>':''}</div>
        <div class="cp-meta">${c.qtde?fmt0(c.qtde)+' '+m.unidCompra:''}${c.qtde&&c.forn?' · ':''}${c.forn||''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">${varTxt}
        ${cs.length>1?'<button class="cp-del" title="Remover">×</button>':''}</div>`;
    const del=div.querySelector('.cp-del');
    if(del) del.onclick=()=>{
      if(confirm('Remover esta compra do histórico?')){
        const arr=D.compras[k];
        const idx=arr.findIndex(x=>x.data===c.data && x.preco===c.preco);
        if(idx>=0) arr.splice(idx,1);
        renderHist(); renderAll();
      }
    };
    box.appendChild(div);
  });
}
function salvarCompra(k){
  const data=document.getElementById('nc-data').value;
  const preco=parseFloat(document.getElementById('nc-preco').value)||0;
  const qtde=parseFloat(document.getElementById('nc-qtde').value)||0;
  const forn=document.getElementById('nc-forn').value||'';
  if(!data||preco<=0){ alert('Informe a data e o preço.'); return; }
  const m=matPorChave(k);
  if(!D.compras[k]) D.compras[k]=[];
  D.compras[k].push({data,preco,qtde,forn,
    precoNF:m.precoNF||0, qtdeNF:m.qtdeNF||0, qtdeReal:m.qtdeReal||0});
  formOpen=false;
  renderHist();
  renderAll();
}
document.querySelectorAll('.h-sel button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.h-sel button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); hNivel=b.dataset.h; hItem=null; formOpen=false;
  renderSeletor(); renderHist();
});

function renderAll(){
  renderMat(KEYS.map(k=>D.agregados[k]),'agregados','ag');
  renderMat(D.aco,'aco','ac');
  renderMat(D.embalagem,'embalagem','em');
  renderTracos();
  renderAcoEmb();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('v-'+t.dataset.v).classList.add('on');
});
renderAll();
renderSeletor();
renderHist();

}

// START

Persist.init(db, fb, "custos", updateSync);
initAuth();
</script>
